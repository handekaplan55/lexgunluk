<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2a1d49"><meta name="description" content="Her gün bir Yargıtay kararı ve bir hukuk makalesi"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-192.png"><title>LexGünlük | Günde 1 karar + 1 makale</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#faf8fd;color:#29223a}*{box-sizing:border-box}body{margin:0}main{max-width:850px;margin:auto;padding:34px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}h1{font-family:Georgia,serif;color:#3d2b60;font-size:34px;margin:0}h1 span{color:#9a76cc}.date{color:#817690;font-size:14px}h2{font-family:Georgia,serif;font-size:25px;margin:3px 0 14px}.intro{font-size:16px;color:#655b71;margin:0 0 25px}.cards{display:grid;gap:18px}.card{background:white;border:1px solid #eee8f5;border-radius:22px;padding:27px;box-shadow:0 7px 25px #2a164008}.eyebrow{font-size:12px;letter-spacing:1.1px;font-weight:800;color:#8b62b2;text-transform:uppercase;margin-bottom:10px}.meta{color:#81758c;font-size:13px}.excerpt{background:#f7f3fb;border-radius:12px;padding:15px;line-height:1.75;overflow-wrap:anywhere}.usage{margin:15px 0;color:#584c68;line-height:1.7}a.button{display:inline-block;padding:12px 18px;border-radius:11px;background:#63418d;color:white;text-decoration:none;font-size:14px;font-weight:700}a.button:hover{background:#483168}.note{font-size:12px;color:#918797;line-height:1.5}footer{text-align:center;margin:30px 0;color:#847a90;font-size:12px}@media(max-width:500px){main{padding:24px 14px}h1{font-size:29px}.card{padding:21px}h2{font-size:22px}}
</style></head><body><main><header><h1>⚖ Lex<span>Günlük</span></h1><div class="date" id="date"></div></header><p class="intro">Her gün yalnızca iki şey: <strong>1 Yargıtay kararı ve 1 hukuk makalesi.</strong></p><div class="cards"><article class="card"><div class="eyebrow">01 · Günün Yargıtay kararı</div><div id="case"><p>Karar yükleniyor…</p></div></article><article class="card"><div class="eyebrow">02 · Günün hukuk makalesi</div><div id="article"><p>Makale yükleniyor…</p></div></article></div><footer>Doğrulanmayan içtihatlar yayımlanmaz. Dilekçeye almadan önce kararın tam metnini inceleyin.</footer></main><script>
const localNow=()=>new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Istanbul'});
const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#date').textContent=new Date().toLocaleDateString('tr-TR',{timeZone:'Europe/Istanbul',day:'numeric',month:'long',year:'numeric'});
const make=(item,kind)=>{if(!item)return '<h2>Bugün henüz içerik bulunamadı</h2><p class="usage">Kaynak araştırması tamamlanamadı veya doğrulanmış uygun bir içerik bulunamadı. Önceki kayıtları bugünün içeriği gibi göstermiyoruz.</p>';const src=item.url&&/^https:\/\//.test(item.url)?item.url:'';const txt=kind==='case'?item.excerpt:item.summary;const label=kind==='case'?'Resmî Yargıtay aramasını aç':'Makaleyi kaynağında oku';return `<h2>${escapeHTML(item.title)}</h2><p class="meta">${kind==='case'?escapeHTML(item.daire)+' · E. '+escapeHTML(item.esas_no)+' · K. '+escapeHTML(item.karar_no)+' · '+escapeHTML(item.decision_date):escapeHTML(item.author)+' · '+escapeHTML(item.published)}</p><p class="note">${kind==='case'?'Tam metinden otomatik seçilen bölüm; hukuki sonuç özeti değildir.':'Makale üstverisinden gelen açıklama; tam metin doğrulaması gerektirir.'}</p><div class="excerpt">${escapeHTML(txt)}</div><p class="usage"><strong>Dilekçede değerlendirme:</strong> ${escapeHTML(item.usage||'Kaynağı inceleyin.')}</p>${kind==='case'?'<p class="note">Kararı açmak için resmî arama ekranına esas/karar numarasını girin.</p>':''}${src?`<a class="button" href="${escapeHTML(src)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`:''}`};
(async()=>{try{let r=await fetch('./gunluk-kararlar.json?date='+encodeURIComponent(localNow()),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let all=await r.json(),d=localNow();let items=Array.isArray(all)?all:[];document.querySelector('#case').innerHTML=make(items.find(x=>x.daily_date===d&&x.kind==='Yargıtay Kararı'),'case');document.querySelector('#article').innerHTML=make(items.find(x=>x.daily_date===d&&x.kind==='Makale'),'article');}catch{document.querySelector('#case').textContent='Günlük veri şu anda alınamıyor.';document.querySelector('#article').textContent='Günlük veri şu anda alınamıyor.'}})();
</script></body></html>
