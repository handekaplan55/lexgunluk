name: Günlük Yargıtay Kararları
on:
  schedule:
    - cron: '15 5 * * *' # UTC, Türkiye 08:15
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python update_decisions.py
      - name: Karar listesini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/decisions.json
          git diff --cached --quiet || (git commit -m "Günlük karar güncellemesi" && git push)
