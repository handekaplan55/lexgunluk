name: Gunluk Yargitay Karari ve Makale

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: write

jobs:
  gunluk-arastirma:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Yargitay karari ve makale arastir
        run: python scripts/daily_bulletin.py

      - name: Icerikleri yayinla
        run: |
          git config user.name "lexgunluk-bot"
          git config user.email "lexgunluk-bot@users.noreply.github.com"
          git add gunluk-kararlar.json gunluk-kararlar.js
          if ! git diff --cached --quiet; then
            git commit -m "Gunluk hukuk bulteni"
            git push
          fi
